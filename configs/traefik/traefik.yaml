# ==============================================================================
# Server Bootstrap Framework — Traefik v3 Static Configuration
# ==============================================================================
#
# Description:
#   Static configuration for Traefik v3 HTTP Reverse Proxy in Layer 2 platform.
#   Designed exclusively for Cloudflare Tunnel ingress architecture.
#   All TLS termination is handled at Cloudflare Edge.
#   Traefik acts strictly as an internal HTTP router, service discoverer, and middleware engine.
#
# ==============================================================================

# Global Log Configuration
log:
  level: INFO
  format: json

# Access Log Configuration
accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-599"

# API & Dashboard Configuration
api:
  dashboard: true
  insecure: false

# Prometheus Metrics Configuration
metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addServicesLabels: true

# Ping Healthcheck Endpoint (used by container healthcheck)
ping:
  entryPoint: traefik

# EntryPoints Configuration
entryPoints:
  # Internal management entrypoint for ping / metrics / internal dashboard
  traefik:
    address: ":8080"

  # HTTP Entrypoint — Port 80 (Cloudflare Tunnel forwards traffic here as plain HTTP)
  web:
    address: ":80"

  # HTTPS Entrypoint — Port 443 (Active in MODE=public)
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Certificates Resolvers Configuration (Active when MODE=public)
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${LETSENCRYPT_EMAIL:-admin@example.com}"
      storage: "/data/acme.json"
      httpChallenge:
        entryPoint: web

# Dynamic Configuration Providers
providers:
  # Docker Socket Proxy Provider (Communicates strictly over TCP to socket proxy)
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: "proxy-net"
    watch: true

  # File Provider for dynamic middlewares
  file:
    directory: "/etc/traefik/dynamic"
    watch: true
