# ==============================================================================
# Server Bootstrap Framework — Layer 2 Cloudflare Tunnel Specification
# ==============================================================================
#
# Description:
#   Compose specification for Cloudflare Zero Trust Tunnel agent (cloudflared).
#   Provides secure ingress gateway routing external HTTP/HTTPS traffic from Cloudflare Edge
#   to Traefik (http://traefik:80) over internal Docker bridge network 'proxy-net'.
#
# Constraints & Security:
#   - Server exposes NO host incoming ports (ports 80 and 443 on host are NOT bound).
#   - Requires CLOUDFLARE_TUNNEL_TOKEN configured in .env.
#
# ==============================================================================

name: platform

networks:
  proxy-net:
    external: true
    name: proxy-net

services:
  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel Agent — Zero Trust Ingress Gateway
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-2025.7.0}
    container_name: cloudflared
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
        reservations:
          cpus: '0.05'
          memory: 16M
