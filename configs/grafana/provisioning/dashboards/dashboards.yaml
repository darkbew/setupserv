# ==============================================================================
# Grafana — Automatic Dashboard Provisioning Specification
# ==============================================================================

apiVersion: 1

providers:
  - name: 'Platform Operational Dashboards'
    orgId: 1
    folder: 'Platform Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/default
