# ==============================================================================
# Server Bootstrap Framework — Layer 2 Platform Base Compose Specification
# ==============================================================================
#
# Description:
#   Base Compose file for Layer 2 Platform Infrastructure.
#   Deploys tecnativa/docker-socket-proxy (security proxy for Docker API socket)
#   and Traefik v3 (internal HTTP reverse proxy for Cloudflare Tunnel ingress).
#
# Security & Constraints:
#   - Server has NO public IP and exposes NO host ports (no 80 or 443 on host).
#   - All incoming traffic routes securely through Cloudflare Tunnel (cloudflared).
#   - Traefik communicates strictly with docker-socket-proxy over TCP port 2375.
#   - Traefik handles internal HTTP routing only (TLS is terminated at Cloudflare Edge).
#
# ==============================================================================

name: platform

networks:
  proxy-net:
    external: true
    name: proxy-net
  backend-net:
    external: true
    name: backend-net
  monitoring-net:
    external: true
    name: monitoring-net

services:
  # ----------------------------------------------------------------------------
  # Docker Socket Proxy — Secure API Firewall over /var/run/docker.sock
  # ----------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_IMAGE_TAG:-0.3.0}
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - LOGS=1
      - NETWORKS=1
      - SERVICES=0
      - TASKS=0
      - VERSION=1
      - INFO=1
      - POST=0
      - EXEC=0
      - BUILD=0
      - VOLUMES=0
      - SECRETS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      monitoring-net:
        aliases:
          - docker-socket-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:2375/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M

  # ----------------------------------------------------------------------------
  # Traefik v3 — Internal HTTP Reverse Proxy & Service Discovery Engine
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_IMAGE_TAG:-3.4}
    container_name: traefik
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    environment:
      - DOMAIN=${DOMAIN:-example.com}
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
      - TRAEFIK_INGRESS_MODE=${INGRESS_MODE:-tunnel}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
    volumes:
      - ../../configs/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ../../configs/traefik/dynamic/:/etc/traefik/dynamic/:ro
      - ../../data/traefik/acme.json:/data/acme.json
    networks:
      - proxy-net
      - monitoring-net
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@docker,security-headers@file"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_BASIC_AUTH}"
