# ==============================================================================
# Server Bootstrap Framework — Layer 2 Monitoring & Logging Stack
# ==============================================================================
#
# Description:
#   Streamlined, lightweight monitoring & logging overlay containing:
#   Prometheus, Grafana, Node Exporter, Uptime Kuma, and Dozzle.
#   Loki, Promtail, and cAdvisor are intentionally excluded to keep RAM < 1.0GB.
#
# Cloudflare Tunnel Architecture:
#   Traefik entrypoint is 'web' (HTTP port 80 internal).
#   TLS termination is handled at Cloudflare Edge.
#
# ==============================================================================

name: platform

networks:
  proxy-net:
    external: true
    name: proxy-net
  monitoring-net:
    external: true
    name: monitoring-net

services:
  # ----------------------------------------------------------------------------
  # Prometheus — Metrics Collector & Time-Series DB
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.4.1}
    container_name: prometheus
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ../../configs/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../../data/prometheus/data:/prometheus:rw
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  # ----------------------------------------------------------------------------
  # Grafana — Metrics Visualization & Platform Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.6.0}
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../data/grafana/data:/var/lib/grafana:rw
    networks:
      - proxy-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_SUBDOMAIN:-monitor}.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=security-headers@file"

  # ----------------------------------------------------------------------------
  # Node Exporter — Host System Metrics Exporter
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-v1.9.1}
    container_name: node-exporter
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9100/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M

  # ----------------------------------------------------------------------------
  # Uptime Kuma — Application Uptime & HTTP Endpoint Monitoring
  # ----------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_IMAGE_TAG:-1}
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../data/uptime-kuma/data:/app/data:rw
    networks:
      - proxy-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`${UPTIME_KUMA_SUBDOMAIN:-status}.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.kuma.entrypoints=web"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
      - "traefik.http.routers.kuma.middlewares=security-headers@file"

  # ----------------------------------------------------------------------------
  # Dozzle — Zero-Database Ultra-Lightweight Container Log Viewer
  # ----------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:${DOZZLE_IMAGE_TAG:-v8.11.8}
    container_name: dozzle
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    networks:
      - proxy-net
      - monitoring-net
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_SUBDOMAIN:-logs}.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle.middlewares=security-headers@file"
