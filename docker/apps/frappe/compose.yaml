# ==============================================================================
# Setupserv Framework — Layer 3 Application: Frappe Framework v15
# (ERPNext v15 + HRMS v15 + LMS v15 + Dedicated MariaDB & Redis)
# Adapted from Official frappe_docker Production Architecture
# ==============================================================================

name: frappe-app

networks:
  proxy-net:
    external: true
    name: proxy-net
  backend-net:
    external: true
    name: backend-net

volumes:
  frappe-sites:
    name: frappe-sites
  frappe-logs:
    name: frappe-logs
  mariadb-data:
    name: frappe-mariadb-data
  redis-cache-data:
    name: frappe-redis-cache-data
  redis-queue-data:
    name: frappe-redis-queue-data

services:
  # ----------------------------------------------------------------------------
  # Dedicated MariaDB Database Engine for Frappe
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:${MARIADB_IMAGE_TAG:-11.4}
    container_name: frappe-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=${MARIADB_CHARACTER_SET:-utf8mb4}
      - --collation-server=${MARIADB_COLLATION:-utf8mb4_unicode_ci}
      - --skip-character-set-client-handshake
      - --skip-name-resolve
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-1G}
      - --innodb-log-file-size=256M
      - --max-allowed-packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-CHANGE_ME_STRONG_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M

  # ----------------------------------------------------------------------------
  # Dedicated Redis Cache
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    container_name: frappe-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Dedicated Redis Queue
  # ----------------------------------------------------------------------------
  redis-queue:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    container_name: frappe-redis-queue
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-queue-data:/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Configurator (One-shot initialization for common_site_config.json)
  # ----------------------------------------------------------------------------
  configurator:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-configurator
    restart: on-failure
    entrypoint:
      - bash
      - -c
      - |
        ls -la /home/frappe/frappe-bench/sites/common_site_config.json || true
        bench set-config -g db_host mariadb
        bench set-config -g db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -g socketio_port 9000
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
    networks:
      - backend-net
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Frappe Backend Gunicorn App Server
  # ----------------------------------------------------------------------------
  backend:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-backend
    restart: unless-stopped
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
      - frappe-logs:/home/frappe/frappe-bench/logs:rw
    networks:
      - proxy-net
      - backend-net
    depends_on:
      configurator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Frappe Frontend Nginx Web Server & Static Assets Proxy (Traefik Target)
  # ----------------------------------------------------------------------------
  frontend:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-frontend
    restart: unless-stopped
    command:
      - nginx
      - -g
      - daemon off;
    environment:
      - BACKEND_SDK=backend:8000
      - SOCKETIO_PORT=9000
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - FRAPPE_PY=backend:8000
      - FRAPPE_SOCKETIO=websocket:9000
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
      - frappe-logs:/home/frappe/frappe-bench/logs:ro
    networks:
      - proxy-net
      - backend-net
    depends_on:
      - backend
      - websocket
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frappe.rule=Host(`${FRAPPE_SUBDOMAIN:-erp}.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.frappe.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.services.frappe.loadbalancer.server.port=8080"
      - "traefik.http.routers.frappe.middlewares=security-headers@file,gzip-compress@file"

  # ----------------------------------------------------------------------------
  # Frappe Realtime Socket.IO Server
  # ----------------------------------------------------------------------------
  websocket:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-websocket
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
      - frappe-logs:/home/frappe/frappe-bench/logs:rw
    networks:
      - proxy-net
      - backend-net
    depends_on:
      configurator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Frappe Background Scheduler Engine
  # ----------------------------------------------------------------------------
  scheduler:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-scheduler
    restart: unless-stopped
    command: bench schedule
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
      - frappe-logs:/home/frappe/frappe-bench/logs:rw
    networks:
      - backend-net
    depends_on:
      configurator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Frappe Worker (Short & Long Jobs)
  # ----------------------------------------------------------------------------
  worker-default:
    image: frappe/erpnext:${FRAPPE_VERSION:-v15}
    container_name: frappe-worker-default
    restart: unless-stopped
    command: bench worker --queue default,short,long
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites:rw
      - frappe-logs:/home/frappe/frappe-bench/logs:rw
    networks:
      - backend-net
    depends_on:
      configurator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
