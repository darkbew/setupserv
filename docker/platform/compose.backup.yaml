# ==============================================================================
# Server Bootstrap Framework — Layer 2 Backup Engine Overlay
# ==============================================================================
#
# Description:
#   Compose overlay specification for Automated Backup Engine worker.
#   Runs automated database dumps, file compression, GPG encryption, and rclone sync.
#   Activated when INSTALL_BACKUP=yes in .env.
#
# ==============================================================================

name: platform

networks:
  backend-net:
    external: true
    name: backend-net

services:
  # ----------------------------------------------------------------------------
  # Backup Worker — Database Dump & Rclone Offsite Backup Engine
  # ----------------------------------------------------------------------------
  backup-worker:
    image: rclone/rclone:1.68.2
    container_name: backup-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c", "printf '%s /bin/sh /scripts/backup.sh >> /var/log/backup.log 2>&1\\n' \"$$(echo \"$${BACKUP_SCHEDULE:-0 2 * * *}\" | tr -d '\\n;&|')\" > /etc/crontabs/root && /bin/sh /scripts/backup.sh || true; exec crond -f -l 2"]
    environment:
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_LOCAL_RETENTION_DAYS=${BACKUP_LOCAL_RETENTION_DAYS:-7}
      - BACKUP_REMOTE_NAME=${BACKUP_REMOTE_NAME:-gdrive}
      - BACKUP_REMOTE_PATH=${BACKUP_REMOTE_PATH:-bootstrap-backups}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ../../backups:/backups:rw
      - ../../configs:/configs:ro
      - ../../secrets:/secrets:ro
      - ../../scripts:/scripts:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last_backup_success || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M
